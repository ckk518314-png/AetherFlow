name: AetherFlow
options:
  bundleIdPrefix: com.aetherflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    INFOPLIST_KEY_CFBundleDisplayName: AetherFlow

targets:
  AetherFlow:
    type: application
    platform: iOS
    sources:
      - path: Sources/AetherFlow
        excludes:
          - Extensions/Widget
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aetherflow.app
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - target: AetherFlowWidget

  AetherFlowWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/AetherFlow/Extensions/Widget
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aetherflow.app.widget

  AetherFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AetherFlowTests
    dependencies:
      - target: AetherFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aetherflow.app.tests
