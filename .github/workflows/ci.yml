name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ipa:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (no signing)
        run: |
          xcodebuild archive \
            -project AetherFlow.xcodeproj \
            -scheme AetherFlow \
            -archivePath build/AetherFlow.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/AetherFlow.xcarchive/Products/Applications/AetherFlow.app Payload/
          zip -r AetherFlow.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AetherFlow.ipa
          path: AetherFlow.ipa

      - name: Upload Build Page
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: install
          path: AetherFlow.ipa
